# /etc/nginx/sites-available/tinysquish.com  (copy kept in the repo for reference)

# Visitor counter rate limit (see deploy/nginx-visits.conf)
limit_req_zone $binary_remote_addr zone=tinysquish_visits:1m rate=20r/m;

# Canonical host is the apex: one 301 hop from www, path and query preserved
server {
    server_name www.tinysquish.com;
    return 301 https://tinysquish.com$request_uri;

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/tinysquish.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tinysquish.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    server_name tinysquish.com;

    root /var/www/tinysquish.com;
    index index.html;

    # Own log so crawler/AI-bot activity can be measured (tools/crawler-report.py);
    # rotated with the other nginx logs (14 days)
    access_log /var/log/nginx/tinysquish.access.log;
    error_page 404 /404.html;

    # Pages, JS, CSS, text: always revalidate (ETag -> 304), so a deploy is visible immediately
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Fonts and images rarely change: cache for 30 days
    location ~* \.(woff2|png|ico|svg)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Public visitor counter (user service tinysquish-visits on :8111)
    location = /api/visits {
        limit_req zone=tinysquish_visits burst=10 nodelay;
        proxy_pass http://127.0.0.1:8111;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml application/xml;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tinysquish.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tinysquish.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Plain HTTP (both hosts) goes straight to the canonical https URL
server {
    listen 80;
    listen [::]:80;
    server_name tinysquish.com www.tinysquish.com;
    return 301 https://tinysquish.com$request_uri;
}
