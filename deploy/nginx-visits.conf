# Added to /etc/nginx/sites-available/tinysquish.com
# (top level of the file, outside the server blocks):
limit_req_zone $binary_remote_addr zone=tinysquish_visits:1m rate=20r/m;

# (inside the 443 server block):
location = /api/visits {
    limit_req zone=tinysquish_visits burst=10 nodelay;
    proxy_pass http://127.0.0.1:8111;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# (inside the 443 server block) gzip for static assets, scoped to this site:
gzip_vary on;
gzip_types text/css application/javascript application/json image/svg+xml;
